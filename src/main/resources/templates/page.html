<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Boot Todo App</title>
    <link rel="stylesheet" th:href="@{page.css}">
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <!-- Header -->
    <header class="app-header">
        <div>
            <h1 class="app-title">Tasks</h1>
            <!-- Formatted Date and Weekday Name -->
            <p class="app-subtitle" th:text="${#temporals.format(today, 'EEEE, MMMM dd, yyyy')}">
                Wednesday, September 23, 2026
            </p>
        </div>
        <span class="task-badge" th:text="${#lists.size(tasks)} + ' total'">0 total</span>
    </header>

    <!-- Body -->
    <div class="app-body">
        <!-- Search & Filter Controls -->
        <div class="controls-container">
            <!-- Search Form -->
            <form th:action="@{/tasks}" method="get" class="search-form">
                <input type="hidden" name="filter" th:value="${currentFilter}" />
                <input type="text"
                       name="search"
                       th:value="${currentSearch}"
                       placeholder="Search tasks..."
                       class="search-input" />
                <button type="submit" class="btn-search">Search</button>
            </form>

            <!-- Filter Tabs -->
            <div class="filter-tabs">

                <a th:href="@{/tasks(filter='all')}"
                   class="filter-tab"
                   th:classappend="${currentFilter == 'all'} ? 'active' : ''">
                    All
                </a>

                <a th:href="@{/tasks(filter='active')}"
                   class="filter-tab"
                   th:classappend="${currentFilter == 'active'} ? 'active' : ''">
                    Active
                </a>

                <a th:href="@{/tasks(filter='completed')}"
                   class="filter-tab"
                   th:classappend="${currentFilter == 'completed'} ? 'active' : ''">
                    Completed
                </a>

            </div>

        <!-- Add Task Form -->
        <form th:action="@{/tasks}" th:object="${newTask}" method="post" class="task-form">
            <input type="text"
                   th:field="*{title}"
                   placeholder="Add a new task..."
                   required
                   class="task-input" />

            <!-- Priority Selection -->
            <select th:field="*{priority}" class="form-select">
                <option value="LOW">Low</option>
                <option value="MEDIUM">Medium</option>
                <option value="HIGH">High</option>
            </select>

            <!-- Due Date Picker -->
            <input type="date" id="dueDate" th:field="*{dueDate}" class="form-date" />

            <button type="submit" class="btn-add">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                </svg>
                <span>Add</span>
            </button>
        </form>

        <!-- Task List -->
        <ul class="task-list">
            <li th:each="task : ${tasks}" class="task-item">
                <div class="task-content">
                    <!-- Toggle Checkbox -->
                    <a th:href="@{/tasks/toggle/{id}(id=${task.id}, filter=${currentFilter}, search=${currentSearch})}" class="checkbox-btn">
                        <div class="custom-checkbox" th:classappend="${task.completed} ? 'checked' : ''">
                            <svg th:if="${task.completed}" class="check-icon" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                            </svg>
                        </div>
                    </a>

                    <div>
                        <!-- Task Title -->
                        <span th:text="${task.title}"
                              class="task-title"
                              th:classappend="${task.completed} ? 'completed' : ''">
                                Task Title
                            </span>

                        <!-- Task Due Date & Priority Badges -->
                        <div class="task-meta">
                                <span th:if="${task.priority != null}"
                                      th:text="${task.priority}"
                                      class="priority-badge"
                                      th:classappend="${task.priority == 'HIGH'} ? 'priority-high' : (${task.priority == 'MEDIUM'} ? 'priority-medium' : 'priority-low')">
                                    LOW
                                </span>

                            <span th:if="${task.dueDate != null}"
                                  th:text="'Due: ' + ${#temporals.format(task.dueDate, 'MMM dd, yyyy')}"
                                  class="due-date-text">
                                    Due Date
                                </span>
                        </div>
                    </div>
                </div>

                <div class="task-actions">
                    <!-- Toggle Button -->
                    <!-- Toggle Button -->
                    <a th:href="@{/tasks/toggle/{id}(id=${task.id})}"
                       class="checkbox-btn action-btn toggle"
                       th:title="${task.completed} ? 'Mark incomplete' : 'Mark complete'">
                        <svg class="action-icon" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                        </svg>
                    </a>

                    <!-- Delete Button -->
                    <a th:href="@{/tasks/delete/{id}(id=${task.id})}"
                       onclick="return confirm('Are you sure you want to delete this task?');"
                       class="action-btn delete"
                       title="Delete task">
                        <svg class="action-icon" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                        </svg>
                    </a>
                </div>
            </li>
        </ul>

        <!-- Empty State -->
        <div th:if="${#lists.isEmpty(tasks)}" class="empty-state">
            <div class="empty-icon-wrapper">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                </svg>
            </div>
            <p class="empty-text-main">No tasks found</p>
            <p class="empty-text-sub">Try changing your search or filter options.</p>
        </div>
    </div>
</div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const dateInput = document.getElementById("dueDate");
        if (dateInput) {
            const today = new Date().toISOString().split("T")[0];
            dateInput.setAttribute("min", today);
        }
    });
</script>
</body>
</html>
